<script>
"use strict";

function showBootError(label, err) {
  const msg = (err && err.stack) ? err.stack : (err && err.message) ? err.message : String(err);
  const pre = document.createElement("pre");
  pre.className = "boot-error";
  pre.textContent = label + ":\n" + msg;
  document.body.prepend(pre);
}
window.addEventListener("error", (e) => showBootError("Runtime error", e.error || e.message));
window.addEventListener("unhandledrejection", (e) => showBootError("Unhandled promise rejection", e.reason));

// Startup errors are still caught by the window listeners above, so this no longer needs its
// own try/catch — that wrapper was the actual bug: in strict mode, function declarations
// inside a block (a try{} block included) are scoped to that block, so none of the functions
// below were reachable from the global scope your onclick="..." handlers run in.

// ---------- constants ----------
const ITEMS_KEY = "todo:items:v3";
const HABITS_KEY = "todo:habits:v1";
const SETTINGS_KEY = "todo:settings:v3";

const PRIORITIES = [
  { id: "low", key: "low", color: "#6FBF8F" },
  { id: "medium", key: "medium", color: "#F0A85E" },
  { id: "high", key: "high", color: "#E8836F" },
];
const LANGS = [
  { code: "en", name: "English" }, { code: "es", name: "Español" }, { code: "pt", name: "Português" },
  { code: "fr", name: "Français" }, { code: "de", name: "Deutsch" }, { code: "it", name: "Italiano" },
  { code: "ru", name: "Русский" }, { code: "ja", name: "日本語" }, { code: "ko", name: "한국어" },
  { code: "zh", name: "中文" }, { code: "ar", name: "العربية" }, { code: "hi", name: "हिन्दी" },
  { code: "tr", name: "Türkçe" }, { code: "nl", name: "Nederlands" }, { code: "id", name: "Bahasa Indonesia" },
];
const RTL_LANGS = new Set(["ar"]);

const KOREAN_HOLIDAYS = new Set([
  "2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-03-01", "2026-05-05",
  "2026-05-24", "2026-06-06", "2026-08-15", "2026-09-24", "2026-09-25", "2026-09-26",
  "2026-10-03", "2026-10-09", "2026-12-25",
]);

// Real, verified photos (Unsplash License) — used instantly, before any network call resolves.
const FALLBACK_IMAGES = [
  { url: "https://images.unsplash.com/photo-1652172175826-4d769c1ffcec?w=1600&q=80&auto=format&fit=crop", place: "Namsan Tower, Seoul" },
  { url: "https://images.unsplash.com/photo-1646906975349-eebfad38ee3b?w=1600&q=80&auto=format&fit=crop", place: "Han River, Seoul" },
  { url: "https://images.unsplash.com/photo-1721999591032-a8b3845c9564?w=1600&q=80&auto=format&fit=crop", place: "Seoraksan National Park" },
  { url: "https://images.unsplash.com/photo-1677097607726-480ca3bfd528?w=1600&q=80&auto=format&fit=crop", place: "Ulsanbawi, Seoraksan" },
];
function dailyLandscapeUrl() { return FALLBACK_IMAGES[dayOfYear() % FALLBACK_IMAGES.length]; }

// Country each language maps to, for pulling a real photo of the relevant place.
const COUNTRY_BY_LANG = {
  en: "United States", es: "Spain", pt: "Brazil", fr: "France", de: "Germany", it: "Italy",
  ru: "Russia", ja: "Japan", ko: "South Korea", zh: "China", ar: "United Arab Emirates",
  hi: "India", tr: "Turkey", nl: "Netherlands", id: "Indonesia",
};

// Live upgrade over the fallback above: pulls a real photo of the relevant country from
// Wikimedia Commons (no API key, CC/public-domain licensed). This runs fine in a normal
// browser on a real deployed site — it only fails inside Claude's own sandboxed preview panes,
// which is why the fallback exists: so the page is never blank while this resolves (or if it
// never can, in a restricted preview).
async function fetchDailyLandscape(lang) {
  const country = COUNTRY_BY_LANG[lang] || "South Korea";
  const cacheKey = "todo:landscape:" + lang;
  const cached = loadJSON(cacheKey, null);
  if (cached && cached.day === dayOfYear()) return cached.result;

  const query = encodeURIComponent(country + " scenic landscape");
  const url = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=" + query +
    "&gsrnamespace=6&gsrlimit=20&prop=imageinfo&iiprop=url&iiurlwidth=1600&format=json&origin=*";
  const res = await fetch(url);
  const data = await res.json();
  const pages = Object.values((data.query && data.query.pages) || {});
  const photos = pages.map((p) => p.imageinfo && p.imageinfo[0]).filter((ii) => ii && /\.(jpe?g|png)$/i.test(ii.url || ""));
  if (photos.length === 0) return null;
  const pick = photos[dayOfYear() % photos.length];
  const result = { url: pick.thumburl || pick.url, place: country };
  saveJSON(cacheKey, { day: dayOfYear(), result });
  return result;
}
function refreshLandscape() {
  fetchDailyLandscape(state.settings.lang)
    .then((result) => { if (result) { state.landscapeUrl = result; render(); } })
    .catch(() => {}); // sandbox/network restrictions: keep showing the fallback
}
function dayOfYear() {
  const start = new Date(new Date().getFullYear(), 0, 0);
  return Math.floor((new Date() - start) / 86400000);
}
function dayKey(d) { return new Date(d).toISOString().slice(0, 10); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

  matrixLaterDesc: "Not urgent, not critical", matrixEmpty: "Nothing here",

// ---------- domain helpers ----------
function dueLabel(dueDate) {
  if (!dueDate) return null;
  const diff = Math.round((startOfDay(new Date(dueDate + "T00:00:00")) - startOfDay(new Date())) / 86400000);
  if (diff === 0) return { text: "Today", tone: "today" };
  if (diff === 1) return { text: "Tomorrow", tone: "upcoming" };
  if (diff === -1) return { text: "Yesterday", tone: "overdue" };
  if (diff < -1) return { text: (-diff) + "d overdue", tone: "overdue" };
  if (diff > 1 && diff <= 6) return { text: new Date(dueDate + "T00:00:00").toLocaleDateString(undefined, { weekday: "short" }), tone: "upcoming" };
  return { text: new Date(dueDate + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }), tone: "upcoming" };
}
function isUrgent(item) {
  if (!item.dueDate) return false;
  return Math.round((startOfDay(new Date(item.dueDate + "T00:00:00")) - startOfDay(new Date())) / 86400000) <= 0;
}
function streakInfo(h) {
  let count = 0, freezeLeft = 1, usedFreeze = false, d = new Date();
  while (true) {
    const key = dayKey(d);
    if (h.doneDates.includes(key)) { count++; d.setDate(d.getDate() - 1); continue; }
    if (freezeLeft > 0 && count > 0) { freezeLeft--; usedFreeze = true; d.setDate(d.getDate() - 1); continue; }
    break;
  }
  return { count, usedFreeze };
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ---------- natural-language date detection ----------
// Rule-based on-device parsing (not a live model call) — this runs instantly with no network
// dependency, which matters given everything we've hit trying to reach external services from
// inside a file like this. Same idea as Todoist/TickTick's "quick add" date parsing.
const WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];

// Phrases that usually mean a task is time-sensitive even when no explicit date is stated —
// e.g. "package dropped off" or "call the dentist" often implies a deadline the person just
// hasn't written down yet. Rather than guess a date we can't actually know, this drives a
// highlight on the date button so the user notices and confirms one themselves.
const TIME_SIGNAL_KEYWORDS = [
  "drop off", "dropped off", "drop-off", "pick up", "picked up", "pickup",
  "meeting", "appointment", "call", "deadline", "due", "submit", "renew",
  "pay", "deliver", "delivery", "flight", "reservation", "book", "rsvp",
  "expire", "expires", "expiring", "return", "interview", "invoice",
];
function hasTimeSignal(text) {
  const lower = text.toLowerCase();
  return TIME_SIGNAL_KEYWORDS.some((k) => lower.includes(k));
}
function fmtDate(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function formatTime(hhmm) {
  if (!hhmm) return "";
  const parts = hhmm.split(":");
  const h = parseInt(parts[0], 10), m = parts[1];
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ":" + m + " " + period;
}
function parseDateFromText(text) {
  const lower = text.toLowerCase();
  const today = startOfDay(new Date());

  if (/\btoday\b/.test(lower)) return fmtDate(today);
  if (/\btomorrow\b/.test(lower)) { const d = new Date(today); d.setDate(d.getDate() + 1); return fmtDate(d); }
  if (/\bday after tomorrow\b/.test(lower)) { const d = new Date(today); d.setDate(d.getDate() + 2); return fmtDate(d); }

  let m = lower.match(/\bin (\d+) days?\b/);
  if (m) { const d = new Date(today); d.setDate(d.getDate() + parseInt(m[1], 10)); return fmtDate(d); }
  m = lower.match(/\bin (\d+) weeks?\b/);
  if (m) { const d = new Date(today); d.setDate(d.getDate() + parseInt(m[1], 10) * 7); return fmtDate(d); }
  if (/\bnext week\b/.test(lower)) { const d = new Date(today); d.setDate(d.getDate() + 7); return fmtDate(d); }

  for (let i = 0; i < WEEKDAYS.length; i++) {
    const re = new RegExp("\\b(next )?" + WEEKDAYS[i] + "\\b");
    const wm = lower.match(re);
    if (wm) {
      const d = new Date(today);
      let diff = (i - d.getDay() + 7) % 7;
      if (diff === 0) diff = 7; // "monday" in a task always means the next one, not today
      if (wm[1]) diff += 7; // "next monday" skips an extra week
      d.setDate(d.getDate() + diff);
      return fmtDate(d);
    }
  }

  for (let i = 0; i < MONTHS.length; i++) {
    const re = new RegExp("\\b(" + MONTHS[i] + "|" + MONTHS[i].slice(0, 3) + ")\\.?\\s+(\\d{1,2})(st|nd|rd|th)?\\b");
    const mm = lower.match(re);
    if (mm) {
      const day = parseInt(mm[2], 10);
      let year = today.getFullYear();
      const candidate = new Date(year, i, day);
      if (candidate < today) candidate.setFullYear(year + 1);
      return fmtDate(candidate);
    }
  }

  m = lower.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (m) {
    const mo = parseInt(m[1], 10) - 1, day = parseInt(m[2], 10);
    let year = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3], 10) : parseInt(m[3], 10)) : today.getFullYear();
    const candidate = new Date(year, mo, day);
    if (!m[3] && candidate < today) candidate.setFullYear(year + 1);
    if (candidate.getMonth() === mo) return fmtDate(candidate);
  }

  return null;
}

    category: state.draftCategoryText.trim() || null,

    dueDate: dueDate || null,

    notes: "", subtasks: [],

  state.draftDue = ""; state.draftDueAuto = false; state.calendarOpen = false; state.draftInputText = ""; state.draftTime = "";
  state.draftCategoryText = ""; state.draftPriority = null; state.draftSuggestDate = false;

}

    el.focus();
    el.setSelectionRange(text.length, text.length);
  }
}
function toggleItem(id) {
  state.justToggled = id;
  saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { done: !it.done, completedAt: !it.done ? Date.now() : null }) : it));
  setTimeout(() => { state.justToggled = null; }, 400);
}
function deleteItem(id) { saveItems(state.items.filter((it) => it.id !== id)); }
function clearDone() { saveItems(state.items.filter((it) => !it.done)); }
function toggleExpand(id) { state.expandedId = state.expandedId === id ? null : id; render(); }
function updateNotes(id, val) { state.items = state.items.map((it) => it.id === id ? Object.assign({}, it, { notes: val }) : it); saveJSON(ITEMS_KEY, state.items); }
function setItemPriority(id, priorityId) {
  const item = state.items.find((it) => it.id === id);
  const next = item.priority === priorityId ? null : priorityId;
  saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { priority: next }) : it));
}
function setItemCategory(id, val) { saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { category: val.trim() || null }) : it)); }
function setItemDueDate(id, val) { saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { dueDate: val || null, dueTime: val ? it.dueTime : null }) : it)); }
function setItemDueTime(id, val) { saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { dueTime: val || null }) : it)); }
function addSubtask(id) {
  const input = document.getElementById("subDraft_" + id);
  const text = input.value.trim();
  if (!text) return;
  saveItems(state.items.map((it) => it.id === id ? Object.assign({}, it, { subtasks: [...(it.subtasks || []), { id: uid(), text, done: false }] }) : it));
}
function toggleSubtask(id, subId) {
  saveItems(state.items.map((it) => it.id !== id ? it : Object.assign({}, it, { subtasks: it.subtasks.map((s) => s.id === subId ? Object.assign({}, s, { done: !s.done }) : s) })));
}
function deleteSubtask(id, subId) {
  saveItems(state.items.map((it) => it.id !== id ? it : Object.assign({}, it, { subtasks: it.subtasks.filter((s) => s.id !== subId) })));
}
function setCategory(cat) { state.activeCategory = cat; render(); }

function toggleCalendar() {
  state.calendarOpen = !state.calendarOpen;
  if (state.calendarOpen) {
    const base = state.draftDue ? new Date(state.draftDue + "T00:00:00") : new Date();
    state.calendarYear = base.getFullYear();
    state.calendarMonth = base.getMonth();
  }
  render();
}
function calendarNav(delta) {
  state.calendarMonth += delta;
  if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
  if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
  render();
}
function pickCalendarDay(dateStr) {
  state.draftDue = dateStr; state.draftDueAuto = false; state.calendarOpen = false; state.draftSuggestDate = false; render();
}
function clearDraftDue() { state.draftDue = ""; state.draftDueAuto = false; state.draftTime = ""; render(); }
function setView(v) { state.view = v; state.sidebarOpen = false; render(); }
function toggleSidebar() { state.sidebarOpen = !state.sidebarOpen; render(); }
function closeSidebar() { state.sidebarOpen = false; render(); }
function openSettingsFromSidebar() { state.sidebarOpen = false; state.showSettings = true; render(); }
function toggleSettingsPanel() { state.showSettings = !state.showSettings; render(); }
function toggleFeature(key, checked) { saveSettings(Object.assign({}, state.settings, { [key]: checked })); }
function setLang(lang) { saveSettings(Object.assign({}, state.settings, { lang })); refreshLandscape(); }
function togglePriority(id) { state.draftPriority = state.draftPriority === id ? null : id; render(); }

function addHabit() {
  const input = document.getElementById("habitDraft");
  const text = input.value.trim();
  if (!text) return;
  saveHabits([...state.habits, { id: uid(), text, doneDates: [] }]);
}
function toggleHabitToday(id) {
  const today = dayKey(new Date());
  saveHabits(state.habits.map((h) => h.id !== id ? h : Object.assign({}, h, { doneDates: h.doneDates.includes(today) ? h.doneDates.filter((d) => d !== today) : [...h.doneDates, today] })));
}
function deleteHabit(id) { saveHabits(state.habits.filter((h) => h.id !== id)); }

let timerInterval = null;
function timerToggle() {
  state.timer.running = !state.timer.running;
  if (state.timer.running) {
    timerInterval = setInterval(() => {
      state.timer.seconds -= 1;
      if (state.timer.seconds <= 0) {
        state.timer.mode = state.timer.mode === "work" ? "break" : "work";
        state.timer.seconds = state.timer.mode === "work" ? 25 * 60 : 5 * 60;
      }
      renderTimerOnly();
    }, 1000);
  } else {
    clearInterval(timerInterval);
  }
  render();
}
function timerReset() {
  clearInterval(timerInterval);
  state.timer = { seconds: 25 * 60, running: false, mode: "work" };
  render();
}
function renderTimerOnly() {
  const el = document.getElementById("timerNum");
  if (!el) return;
  const mm = String(Math.floor(state.timer.seconds / 60)).padStart(2, "0");
  const ss = String(state.timer.seconds % 60).padStart(2, "0");
  el.textContent = mm + ":" + ss;
}

// ---------- render ----------

function viewTitle() {
  const byView = { calendar: "tabCalendar", matrix: "tabMatrix", habits: "tabHabits", focus: "tabFocus", reflect: "tabReflect" };
  const key = byView[state.view];
  return key ? t(key) : t("title");
}

function renderHeader() {
  const remaining = state.items.filter((i) => !i.done).length;
  const total = state.items.length;
  const subtitle = total === 0 ? t("nothingYet") : (remaining === 0 ? t("allDone") : t("itemsLeft", { n: "<b>" + remaining + "</b>" }));
  const hour = new Date().getHours();
  const greeting = hour < 12 ? t("greetMorning") : hour < 18 ? t("greetAfternoon") : t("greetEvening");
  return '' +
    '<div class="header-row">' +
      '<div>' +
        '<p class="greeting">' + esc(greeting) + '</p>' +
        '<h1>' + esc(viewTitle()) + '</h1>' +
        '<p class="subtitle">' + subtitle + '</p>' +
        '<p class="sync-text">' + esc(t("savedLocally")) + '</p>' +
      '</div>' +
      '<button class="gear-btn" aria-label="' + esc(t("settingsTitle")) + '" onclick="toggleSettingsPanel()">⚙</button>' +
    '</div>';
}

function hamburgerIconSvg() {
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}

function renderSidebar() {
  const navItems = [["list", t("tabList")], ["calendar", t("tabCalendar")]];
  if (state.settings.matrix) navItems.push(["matrix", t("tabMatrix")]);
  if (state.settings.habits) navItems.push(["habits", t("tabHabits")]);
  if (state.settings.pomodoro) navItems.push(["focus", t("tabFocus")]);
  if (state.settings.reflection) navItems.push(["reflect", t("tabReflect")]);

  const navHtml = navItems.map(([id, label]) =>
    '<button class="nav-item' + (state.view === id ? " active" : "") + '" onclick="setView(\'' + id + '\')">' + esc(label) + '</button>'
  ).join("");

  return '' +
    '<div id="sidebarOverlay" class="' + (state.sidebarOpen ? "open" : "") + '" onclick="closeSidebar()"></div>' +
    '<div id="sidebar" class="' + (state.sidebarOpen ? "open" : "") + '" aria-hidden="' + (!state.sidebarOpen) + '">' +
      '<div class="sidebar-head">' +
        '<span class="sidebar-title">Nudge</span>' +
        '<button class="sidebar-close" aria-label="Close menu" onclick="closeSidebar()">×</button>' +
      '</div>' +
      '<nav class="sidebar-nav">' + navHtml + '</nav>' +
      '<button class="nav-item sidebar-settings" onclick="openSettingsFromSidebar()">⚙ ' + esc(t("settingsTitle")) + '</button>' +
    '</div>';
}

function renderSettings() {
  if (!state.showSettings) return "";
  const features = [
    ["matrix", t("featMatrixLabel"), t("featMatrixDesc")],
    ["habits", t("featHabitsLabel"), t("featHabitsDesc")],
    ["pomodoro", t("featPomodoroLabel"), t("featPomodoroDesc")],
    ["reflection", t("featReflectLabel"), t("featReflectDesc")],
  ];
  const rows = features.map(([key, label, desc]) =>
    '<label class="setting-row">' +
      '<input type="checkbox" ' + (state.settings[key] ? "checked" : "") + ' onchange="toggleFeature(\'' + key + '\', this.checked)" style="margin-top:3px" />' +
      '<div><div class="label">' + esc(label) + '</div><div class="desc">' + esc(desc) + '</div></div>' +
    '</label>'
  ).join("");
  const langOptions = LANGS.map((l) => '<option value="' + l.code + '"' + (state.settings.lang === l.code ? " selected" : "") + '>' + esc(l.name) + '</option>').join("");
  return '<div class="settings-panel">' +
    '<div style="font-size:13px;font-weight:700;margin-bottom:10px;color:#2E2A45">' + esc(t("settingsTitle")) + '</div>' +
    rows +
    '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #EDE6F7">' +
      '<div style="font-size:12px;font-weight:600;margin-bottom:6px;color:#2E2A45">' + esc(t("languageLabel")) + '</div>' +
      '<select onchange="setLang(this.value)">' + langOptions + '</select>' +
    '</div>' +
  '</div>';
}

function renderTag(text, cls) { return '<span class="tag' + (cls ? " " + cls : "") + '">' + esc(text) + '</span>'; }

function renderListView() {
  const categories = Array.from(new Set(state.items.filter((i) => i.category).map((i) => i.category)));
  const chips = categories.length > 0
    ? '<div class="chip-row">' +
        '<button class="chip' + (state.activeCategory === null ? " active" : "") + '" onclick="setCategory(null)">All</button>' +
        categories.map((c) => '<button class="chip' + (state.activeCategory === c ? " active" : "") + '" onclick="setCategory(\'' + esc(c).replace(/'/g, "\\'") + '\')">' + esc(c) + '</button>').join("") +
      '</div>'
    : "";

  const dateLabel = state.draftDue ? new Date(state.draftDue + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) + (state.draftTime ? ", " + formatTime(state.draftTime) : "") : "";
  const dateBtnHtml =
    '<div style="position:relative">' +
      '<button type="button" class="date-btn' + (state.draftDue ? " has-value" : "") + (state.draftSuggestDate ? " suggest" : "") + '" aria-label="' + esc(t("pickDate")) + (dateLabel ? ": " + dateLabel : state.draftSuggestDate ? ": " + t("suggestDate") : "") + '" onclick="toggleCalendar()">' +
        '<i class="cal-icon" aria-hidden="true">' + calendarIconSvg() + '</i>' +
        (dateLabel ? '<span>' + esc(dateLabel) + (state.draftDueAuto ? ' <em>' + esc(t("autoDetected")) + '</em>' : "") + '</span>' : "") +
      '</button>' +
      (state.draftSuggestDate ? '<div class="suggest-hint">' + esc(t("suggestDate")) + '</div>' : "") +
      (state.calendarOpen ? renderCalendarPopup() : "") +
    '</div>';

  const priorityPickerHtml = '<div class="priority-picker">' + PRIORITIES.map((p) => {
    const active = state.draftPriority === p.id;
    return '<button type="button" class="priority-pick' + (active ? " active" : "") + '" style="' + (active ? "background:" + p.color + ";border-color:" + p.color : "") + '" aria-pressed="' + active + '" onclick="togglePriority(\'' + p.id + '\')">' +
      '<i style="background:' + (active ? "#FFFFFF" : p.color) + '" aria-hidden="true"></i>' + esc(t(p.key)) +
    '</button>';
  }).join("") + '</div>';

  const categoryInputHtml =
    '<input type="text" id="draftCategory" list="categoryList" value="' + esc(state.draftCategoryText) + '" placeholder="' + esc(t("categoryPlaceholder")) + '" oninput="state.draftCategoryText=this.value" style="flex:1 1 130px" />' +
    '<datalist id="categoryList">' + categories.map((c) => '<option value="' + esc(c) + '"></option>').join("") + '</datalist>';

  const visible = state.activeCategory ? state.items.filter((i) => i.category === state.activeCategory) : state.items;
  const emptyHtml = visible.length === 0
    ? '<div class="empty">' + esc(state.items.length === 0 ? t("emptyAddFirst") : t("allDone")) + '</div>'
    : "";

  const rowsHtml = visible.map((item) => {
    const due = dueLabel(item.dueDate);
    const holiday = item.dueDate && KOREAN_HOLIDAYS.has(item.dueDate);
    const priority = PRIORITIES.find((p) => p.id === item.priority);
    const expanded = state.expandedId === item.id;
    const subtasks = item.subtasks || [];
    const subDone = subtasks.filter((s) => s.done).length;

    const tags = [];
    if (due) tags.push(renderTag(due.text + (item.dueTime ? ", " + formatTime(item.dueTime) : ""), due.tone));
    if (holiday) tags.push(renderTag(t("holidayTag"), "overdue"));
    if (item.category) tags.push(renderTag(item.category));
    if (subtasks.length > 0) tags.push(renderTag(subDone + "/" + subtasks.length));
    const priorityHtml = priority ? '<span class="priority-dot"><i style="background:' + priority.color + '" aria-hidden="true"></i>' + esc(t(priority.key)) + '</span>' : "";
    const tagsHtml = (tags.length > 0 || priorityHtml) ? '<div class="tag-row">' + priorityHtml + tags.join("") + '</div>' : "";

    const subtasksHtml = subtasks.map((s) =>
      '<div class="sub-row">' +
        '<button class="check-sm' + (s.done ? " done" : "") + '" aria-label="' + esc(s.done ? "Mark subtask as not done" : "Mark subtask as done") + '" onclick="toggleSubtask(\'' + item.id + '\',\'' + s.id + '\')">' + (s.done ? tickSvg(8) : "") + '</button>' +
        '<span style="flex:1;font-size:14px;' + (s.done ? "text-decoration:line-through;color:#B3A9C9" : "") + '">' + esc(s.text) + '</span>' +
        '<button class="delete-btn" aria-label="Delete subtask" style="font-size:15px" onclick="deleteSubtask(\'' + item.id + '\',\'' + s.id + '\')">×</button>' +
      '</div>'
    ).join("");

    const itemPriorityPickerHtml = '<div class="priority-picker" style="margin-bottom:8px">' + PRIORITIES.map((p) => {
      const active = item.priority === p.id;
      return '<button type="button" class="priority-pick' + (active ? " active" : "") + '" style="' + (active ? "background:" + p.color + ";border-color:" + p.color : "") + '" aria-pressed="' + active + '" onclick="setItemPriority(\'' + item.id + '\',\'' + p.id + '\')">' +
        '<i style="background:' + (active ? "#FFFFFF" : p.color) + '" aria-hidden="true"></i>' + esc(t(p.key)) +
      '</button>';
    }).join("") + '</div>';

    const expandHtml =
      '<div class="expand-panel' + (expanded ? " open" : "") + '">' +
        itemPriorityPickerHtml +
        '<div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">' +
          '<input type="text" value="' + esc(item.category || "") + '" placeholder="' + esc(t("categoryPlaceholder")) + '" list="categoryList" onchange="setItemCategory(\'' + item.id + '\', this.value)" style="flex:1 1 130px" />' +
          '<input type="date" value="' + esc(item.dueDate || "") + '" onchange="setItemDueDate(\'' + item.id + '\', this.value)" style="flex:1 1 130px" />' +
          (item.dueDate ? '<input type="time" value="' + esc(item.dueTime || "") + '" onchange="setItemDueTime(\'' + item.id + '\', this.value)" style="flex:1 1 110px" />' : "") +
        '</div>' +
        '<textarea class="notes-area" placeholder="' + esc(t("notesPlaceholder")) + '" oninput="updateNotes(\'' + item.id + '\', this.value)">' + esc(item.notes || "") + '</textarea>' +
        subtasksHtml +
        '<div style="display:flex;gap:6px;margin-top:6px">' +
          '<input type="text" id="subDraft_' + item.id + '" placeholder="' + esc(t("subtaskPlaceholder")) + '" onkeydown="if(event.key===\'Enter\'){addSubtask(\'' + item.id + '\');this.value=\'\'}" />' +
        '</div>' +
      '</div>';

    return '<div class="row">' +
      '<div class="row-flex">' +
        '<button class="check' + (item.done ? " done" : "") + (state.justToggled === item.id ? " check-pop" : "") + '" aria-label="' + esc(item.done ? "Mark \"" + item.text + "\" as not done" : "Mark \"" + item.text + "\" as done") + '" onclick="toggleItem(\'' + item.id + '\')">' + (item.done ? tickSvg(11) : "") + '</button>' +
        '<div class="task-text' + (item.done ? " done" : "") + '" onclick="toggleExpand(\'' + item.id + '\')">' + esc(item.text) + tagsHtml + '</div>' +
        '<button class="delete-btn" aria-label="Delete task" onclick="deleteItem(\'' + item.id + '\')">×</button>' +
      '</div>' + expandHtml +
    '</div>';
  }).join("");

  const clearHtml = state.items.some((i) => i.done) ? '<button class="clear-link" onclick="clearDone()">' + esc(t("clearCompleted")) + '</button>' : "";

  return chips +
    '<div style="margin-bottom:8px">' +
      '<div class="add-row">' +
        '<input type="text" id="draftInput" value="' + esc(state.draftInputText) + '" placeholder="' + esc(t("addPlaceholder")) + '" oninput="onDraftInput(this.value)" onkeydown="if(event.key===\'Enter\')addItem()" />' +
        dateBtnHtml +
        '<button class="btn-primary" onclick="addItem()">' + esc(t("addBtn")) + '</button>' +
      '</div>' +
      '<div class="quick-row">' + priorityPickerHtml + categoryInputHtml + '</div>' +
    '</div>' +
    '<div style="margin-top:16px">' + emptyHtml + rowsHtml + '</div>' +
    clearHtml;
}

function tickSvg(size) {
  const h = Math.round(size * 0.82);
  return '<svg width="' + size + '" height="' + h + '" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function calendarIconSvg() {
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
}

function renderCalendarPopup() {
  const y = state.calendarYear, m = state.calendarMonth;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = fmtDate(startOfDay(new Date()));
  const monthLabel = new Date(y, m, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const weekdayRow = WEEKDAYS.map((w) => '<div class="cal-weekday">' + esc(w.slice(0, 2)) + '</div>').join("");

  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const cls = "cal-cell" + (dateStr === todayStr ? " today" : "") + (dateStr === state.draftDue ? " selected" : "");
    cells += '<button type="button" class="' + cls + '" onclick="pickCalendarDay(\'' + dateStr + '\')">' + d + '</button>';
  }

  const timeRowHtml = state.draftDue
    ? '<div class="cal-time-row">' +
        '<label for="calTimeInput">' + esc(t("timeLabel")) + '</label>' +
        '<input type="time" id="calTimeInput" value="' + esc(state.draftTime) + '" onchange="setDraftTime(this.value)" class="cal-time-input" />' +
      '</div>'
    : "";

  return '<div class="cal-popup" role="dialog" aria-label="' + esc(t("pickDate")) + '">' +
    '<div class="cal-nav">' +
      '<button type="button" class="cal-nav-btn" aria-label="Previous month" onclick="calendarNav(-1)">‹</button>' +
      '<span class="cal-month-label">' + esc(monthLabel) + '</span>' +
      '<button type="button" class="cal-nav-btn" aria-label="Next month" onclick="calendarNav(1)">›</button>' +
    '</div>' +
    '<div class="cal-grid cal-weekdays">' + weekdayRow + '</div>' +
    '<div class="cal-grid">' + cells + '</div>' +
    timeRowHtml +
    (state.draftDue ? '<button type="button" class="cal-clear" onclick="clearDraftDue()">' + esc(t("clearDate")) + '</button>' : "") +
  '</div>';
}

function renderCalendarView() {
  const dated = state.items.filter((i) => i.dueDate);
  if (dated.length === 0) return '<div class="empty">' + esc(t("calendarEmpty")) + '</div>';

  const byDate = {};
  dated.forEach((i) => { (byDate[i.dueDate] = byDate[i.dueDate] || []).push(i); });
  const dates = Object.keys(byDate).sort();
  const todayStr = fmtDate(startOfDay(new Date()));

  return '<div class="cal-view">' + dates.map((d) => {
    const items = byDate[d].slice().sort((a, b) => (a.dueTime || "99:99").localeCompare(b.dueTime || "99:99"));
    const isToday = d === todayStr;
    const isPast = d < todayStr;
    const holiday = KOREAN_HOLIDAYS.has(d);
    const dateHeader = new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

    const rows = items.map((item) => {
      const timeStr = item.dueTime ? formatTime(item.dueTime) : "";
      return '<div class="cal-task-row">' +
        '<button class="check-sm' + (item.done ? " done" : "") + '" aria-label="' + esc(item.done ? "Mark as not done" : "Mark as done") + '" onclick="toggleItem(\'' + item.id + '\')">' + (item.done ? tickSvg(8) : "") + '</button>' +
        '<span class="cal-task-time' + (timeStr ? "" : " muted") + '">' + esc(timeStr || "—") + '</span>' +
        '<span class="cal-task-text' + (item.done ? " done" : "") + '">' + esc(item.text) + '</span>' +
      '</div>';
    }).join("");

    return '<div class="cal-day-group">' +
      '<div class="cal-day-header' + (isToday ? " today" : "") + (isPast ? " past" : "") + '">' +
        esc(dateHeader) +
        (isToday ? ' <span class="cal-today-badge">' + esc(t("todayBadge")) + '</span>' : "") +
        (holiday ? ' <span class="cal-holiday-badge">' + esc(t("holidayTag")) + '</span>' : "") +
      '</div>' + rows +
    '</div>';
  }).join("") + '</div>';
}

function renderMatrixView() {
  const pending = state.items.filter((i) => !i.done);
  const quadrants = [
    ["do", t("matrixDo"), t("matrixDoDesc"), (i) => isUrgent(i) && i.priority === "high"],
    ["schedule", t("matrixSchedule"), t("matrixScheduleDesc"), (i) => !isUrgent(i) && i.priority === "high"],
    ["delegate", t("matrixDelegate"), t("matrixDelegateDesc"), (i) => isUrgent(i) && i.priority !== "high"],
    ["later", t("matrixLater"), t("matrixLaterDesc"), (i) => !isUrgent(i) && i.priority !== "high"],
  ];
  return '<div class="matrix-grid">' + quadrants.map(([id, title, desc, filter]) => {
    const list = pending.filter(filter);
    const itemsHtml = list.length === 0
      ? '<div style="font-size:12px;color:#A99FC2">' + esc(t("matrixEmpty")) + '</div>'
      : list.map((i) => '<div class="matrix-item"><button class="check-sm" onclick="toggleItem(\'' + i.id + '\')"></button><span>' + esc(i.text) + '</span></div>').join("");
    return '<div class="matrix-cell"><div class="title">' + esc(title) + '</div><div class="desc">' + esc(desc) + '</div>' + itemsHtml + '</div>';
  }).join("") + '</div>';
}

function renderHabitsView() {
  const today = dayKey(new Date());
  const rows = state.habits.map((h) => {
    const done = h.doneDates.includes(today);
    const info = streakInfo(h);
    const streakText = info.count > 0 ? t("streakDay", { n: info.count }) : t("noStreak");
    return '<div class="row"><div class="row-flex" style="align-items:center">' +
      '<button class="check' + (done ? " done" : "") + '" aria-label="' + esc(done ? "Mark habit as not done today" : "Mark habit as done today") + '" onclick="toggleHabitToday(\'' + h.id + '\')">' + (done ? tickSvg(11) : "") + '</button>' +
      '<div style="flex:1"><div style="font-size:16px">' + esc(h.text) + '</div>' +
      '<div style="font-size:12px;color:#8A81A3;margin-top:2px">' + esc(streakText) + (info.usedFreeze ? " · " + esc(t("freezeUsed")) : "") + '</div></div>' +
      '<button class="delete-btn" onclick="deleteHabit(\'' + h.id + '\')">×</button>' +
    '</div></div>';
  }).join("");
  return '<div class="add-row" style="margin-bottom:16px">' +
      '<input type="text" id="habitDraft" placeholder="' + esc(t("habitPlaceholder")) + '" onkeydown="if(event.key===\'Enter\'){addHabit();this.value=\'\'}" />' +
      '<button class="btn-primary" onclick="addHabit()">' + esc(t("addBtn")) + '</button>' +
    '</div>' +
    (state.habits.length === 0 ? '<div class="empty">' + esc(t("habitEmpty")) + '</div>' : rows);
}

function renderReflectView() {
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return dayKey(d); }).reverse();
  const completedByDay = days.map((k) => state.items.filter((i) => i.completedAt && dayKey(i.completedAt) === k).length);
  const total = completedByDay.reduce((a, b) => a + b, 0);
  const max = Math.max(...completedByDay, 1);
  const bestStreak = state.habits.reduce((m, h) => Math.max(m, streakInfo(h).count), 0);
  const chart = total === 0
    ? '<div class="empty">' + esc(t("reflectNoData")) + '</div>'
    : '<div class="bar-chart">' + days.map((k, idx) => {
        const val = completedByDay[idx];
        return '<div class="bar-col"><div style="font-size:11px;color:#8A81A3">' + val + '</div>' +
          '<div class="bar-fill" style="height:' + Math.max(6, (val / max) * 70) + 'px"></div>' +
          '<div style="font-size:10px;color:#A99FC2">' + esc(new Date(k).toLocaleDateString(undefined, { weekday: "narrow" })) + '</div></div>';
      }).join("") + '</div>';
  return '<div style="font-size:13px;font-weight:700;color:#2E2A45;margin-bottom:12px">' + esc(t("reflectTitle")) + '</div>' +
    chart +
    '<div class="row"><div style="font-size:14px">' + total + ' ' + esc(t("reflectCompleted")) + '</div></div>' +
    (state.habits.length > 0 ? '<div class="row"><div style="font-size:14px">' + esc(t("reflectBestStreak")) + ': ' + bestStreak + '</div></div>' : "");
}

function renderFocusView() {
  const pending = state.items.filter((i) => !i.done);
  const mm = String(Math.floor(state.timer.seconds / 60)).padStart(2, "0");
  const ss = String(state.timer.seconds % 60).padStart(2, "0");
  const modeLabel = state.timer.mode === "work" ? t("focusLabel") : t("breakLabel");
  const modeColor = state.timer.mode === "work" ? "#9B8AE0" : "#F0A85E";
  return '<div class="timer-display">' +
    '<select style="margin-bottom:20px"><option value="">' + esc(t("focusNoTask")) + '</option>' +
      pending.map((i) => '<option>' + esc(i.text) + '</option>').join("") +
    '</select>' +
    '<div style="font-size:12px;font-weight:700;letter-spacing:1px;color:' + modeColor + ';margin-bottom:8px">' + esc(modeLabel) + '</div>' +
    '<div class="timer-num" id="timerNum">' + mm + ":" + ss + '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center">' +
      '<button class="btn-primary" onclick="timerToggle()">' + esc(state.timer.running ? t("pause") : t("start")) + '</button>' +
      '<button class="btn-primary btn-secondary" onclick="timerReset()">' + esc(t("reset")) + '</button>' +
    '</div>' +
  '</div>';
}

function render() {
  const dir = RTL_LANGS.has(state.settings.lang) ? "rtl" : "ltr";
  let body = renderHeader() + renderSettings();
  if (state.view === "list") body += renderListView();
  else if (state.view === "calendar") body += renderCalendarView();
  else if (state.view === "matrix" && state.settings.matrix) body += renderMatrixView();
  else if (state.view === "habits" && state.settings.habits) body += renderHabitsView();
  else if (state.view === "focus" && state.settings.pomodoro) body += renderFocusView();
  else if (state.view === "reflect" && state.settings.reflection) body += renderReflectView();
  else { state.view = "list"; body = renderHeader() + renderSettings() + renderListView(); }

  document.getElementById("root").innerHTML =
    '<div id="page" dir="' + dir + '">' +
      '<button id="hamburgerBtn" aria-label="Open menu" onclick="toggleSidebar()">' + hamburgerIconSvg() + '</button>' +
      renderSidebar() +
      '<img id="bgImage" src="' + (state.landscapeUrl || dailyLandscapeUrl()).url + '" alt="" onerror="this.style.display=\'none\'" />' +
      '<div id="bgCaption">' + esc((state.landscapeUrl || dailyLandscapeUrl()).place) + '</div>' +
      '<div id="inner">' + body + '</div>' +
    '</div>';
}

render();
refreshLandscape();
</script>
</body>
</html>
